# Minimal Supabase CLI config for local development.
# Only needed if you run `supabase start` locally. Cloud usage does not read this.
project_id = "coalguard"

[db]
port = 54322
major_version = 15

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "exp://127.0.0.1:19000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = false
